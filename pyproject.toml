[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradewatch-io"
description = "Tradewatch Python SDK"
version = "0.9.0"
requires-python = ">=3.8"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.24.1",
  "pydantic>=1.9.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tradewatch_io*"]
